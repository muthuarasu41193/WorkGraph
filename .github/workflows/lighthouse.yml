name: Lighthouse budget

# Runs only when the repository variable LHCI_BASE_URL is set to a deployed
# origin that has Supabase configured. The default verify workflow does not
# have that origin, so it does not fail on an unmeasured budget.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    if: vars.LHCI_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          LHCI_BASE_URL: ${{ vars.LHCI_BASE_URL }}
